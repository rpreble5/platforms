<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Host controls</title>
<style>
  /* One phone, one thumb, a dark room. Everything oversized on purpose. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #14101f; color: #e8e2d4;
    font: 500 16px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: #f25f5c; flex: none; }
  #dot.on { background: #3ddc9a; }
  header b { letter-spacing: .06em; font-size: 14px; color: #9a9aa2; }
  #players { margin-left: auto; font: 600 14px ui-monospace, Menlo, monospace; color: #9a9aa2; }

  #card {
    background: #201a33; border: 1px solid #333338; border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  #phase {
    display: inline-block; font: 800 13px ui-monospace, Menlo, monospace;
    letter-spacing: .1em; padding: 3px 10px; border-radius: 999px;
    background: #333338; color: #cfc6e8;
  }
  #phase.answer { background: #1d4b38; color: #3ddc9a; }
  #phase.paused { background: #5c2320; color: #ff8a5c; }
  #qnum { font: 600 13px ui-monospace, Menlo, monospace; color: #82828c; margin-left: 8px; }
  #timer { float: right; font: 800 24px ui-monospace, Menlo, monospace; color: #ffd93d; }
  #qtext { margin: 10px 0 0; font-size: 19px; font-weight: 700; min-height: 3em; }
  #alist { margin: 10px 0 0; padding-left: 24px; font-size: 15px; color: #9a9aa2; }
  #alist li { margin: 4px 0; }
  #alist li.correct { color: #3ddc9a; font-weight: 800; }
  #alist li.correct::after { content: ' ✓'; }
  #akey { margin: 10px 0 0; font-weight: 800; color: #3ddc9a; }

  button {
    width: 100%; border: 0; border-radius: 16px; color: inherit;
    font: 800 22px/1 inherit; padding: 22px; margin-bottom: 12px;
    background: #333338; touch-action: manipulation;
  }
  button:active { transform: scale(0.98); filter: brightness(1.15); }
  button:disabled { opacity: .35; }
  #next { background: #2f7a5a; font-size: 26px; padding: 28px; }
  #pause { background: #44444e; }
  #showdown { background: #5c2320; color: #ffb08a; }
  #menurow { display: flex; gap: 12px; }
  #menurow button { font-size: 16px; padding: 16px 12px; }
  #menu { background: #23324d; color: #9dc4ff; font-size: 17px; padding: 16px; }
  #playersBtn { background: #1f2b3c; color: #9db4d4; font-size: 16px; padding: 14px; }
  #plist {
    background: #201a33; border: 1px solid #333338; border-radius: 16px;
    padding: 4px 14px; margin-bottom: 12px; max-height: 38vh; overflow: auto;
  }
  .prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2c2547; }
  .prow:last-child { border-bottom: 0; }
  .prow .swd { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .prow .nm { font-weight: 700; }
  .prow.off .nm { color: #82828c; text-decoration: line-through; }
  .prow .meta { color: #82828c; font-size: 13px; margin-left: auto; }
  .prow button { width: auto; margin: 0; padding: 8px 14px; font: 800 14px/1 inherit; background: #5c2320; color: #ffb08a; border-radius: 10px; }
  #plist .none { color: #82828c; font-size: 14px; padding: 12px 0; }
  #restart { background: #46213f; color: #ff9db0; font-size: 17px; padding: 16px; }
  #restart.armed { background: #a12f3d; color: #fff; }

  #gate {
    position: fixed; inset: 0; background: #14101f; display: flex;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; font-size: 17px; color: #9a9aa2;
  }
  #gate.hidden { display: none; }
  .spacer { flex: 1; }
  footer { text-align: center; color: #4d4472; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div id="dot"></div>
  <b>HOST</b>
  <span id="players">–</span>
</header>

<div id="card">
  <span id="phase">CONNECTING</span><span id="qnum"></span><span id="timer"></span>
  <p id="qtext">Waiting for the display…</p>
  <ol id="alist" hidden></ol>
  <p id="akey" hidden></p>
</div>

<button id="next">Start game</button>
<div id="menurow" hidden>
  <button id="pack">Pack</button>
  <button id="atime">Time</button>
</div>
<button id="pause">Pause</button>
<button id="showdown" hidden>Start showdown ☠</button>
<button id="playersBtn">Manage players</button>
<div id="plist" hidden></div>
<div class="spacer"></div>
<button id="menu" hidden>Back to main menu</button>
<button id="restart">Restart from question 1</button>
<footer>Commands go to the display. Enter / P / R / Q on its keyboard still work.</footer>

<div id="gate" class="hidden"></div>

<script>
'use strict';
// This page is deliberately dependency-free: JSON frames behind type byte 0,
// same as the rest of the cold path. The key rides in the URL fragment so it
// never appears in an HTTP request line.
const T_JSON = 0;
const key = location.hash.slice(1);

const $ = (id) => document.getElementById(id);
const dot = $('dot'), phaseEl = $('phase'), qnum = $('qnum'), timer = $('timer'),
      qtext = $('qtext'), players = $('players'), gate = $('gate'),
      nextBtn = $('next'), pauseBtn = $('pause'), restartBtn = $('restart'),
      menuBtn = $('menu'),
      showdownBtn = $('showdown'), menuRow = $('menurow'),
      packBtn = $('pack'), timeBtn = $('atime'),
      alist = $('alist'), akey = $('akey');

if (!key) {
  gate.classList.remove('hidden');
  gate.textContent = 'No key in the URL. Open the exact host link printed in the server console (it ends with #XXXX).';
}

/** @type {WebSocket | null} */
let ws = null;
let rejected = false;
let state = null;

function connect() {
  if (rejected || !key) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => sendJson({ type: 'HOST_HELLO', key });
  ws.onclose = () => {
    dot.classList.remove('on');
    if (!rejected) setTimeout(connect, 1000);
  };
  ws.onmessage = (ev) => {
    const bytes = new Uint8Array(ev.data);
    if (!bytes.length || bytes[0] !== T_JSON) return;
    let msg;
    try { msg = JSON.parse(new TextDecoder().decode(bytes.subarray(1))); } catch { return; }
    if (msg.type === 'KICK') {
      rejected = true;
      gate.classList.remove('hidden');
      gate.textContent = 'Key rejected. Re-open the host link from the server console — the key changes on every server restart.';
      return;
    }
    if (msg.type === 'HOST_STATE') {
      dot.classList.add('on');
      state = msg.state;
      render();
    }
    if (msg.type === 'ROSTER') {
      rosterList = Array.isArray(msg.players) ? msg.players : [];
      renderPlayers();
    }
  };
}

function sendJson(obj) {
  if (!ws || ws.readyState !== 1) return;
  const body = new TextEncoder().encode(JSON.stringify(obj));
  const b = new Uint8Array(body.length + 1);
  b[0] = T_JSON;
  b.set(body, 1);
  ws.send(b);
}

function cmd(c) {
  sendJson({ type: 'HOST_CMD', cmd: c });
  if (navigator.vibrate) navigator.vibrate(15);
}

function render() {
  if (!state) return;
  const inLobby = state.phase === 'LOBBY';
  const over = state.phase === 'GAME_OVER';
  const sd = String(state.phase ?? '').startsWith('SHOWDOWN');

  phaseEl.textContent = state.paused
    ? 'PAUSED'
    : state.roundKind === 'control' && state.activeTeam != null
      ? `${state.phase} · PGY${state.activeTeam + 1}`
      : state.phase ?? '–';
  phaseEl.className =
    state.paused ? 'paused' : state.phase === 'ANSWER' || sd ? 'answer' : '';
  qnum.textContent = !inLobby && state.qCount ? `Q${(state.qIndex ?? 0) + 1}/${state.qCount}` : '';
  timer.textContent =
    state.answerLeftMs != null && !state.paused ? Math.ceil(state.answerLeftMs / 1000) + 's' : '';
  qtext.textContent = inLobby
    ? 'In the lobby — waiting for players to join.'
    : over
      ? 'Game over. Final scores are on the screen.'
      : (state.text ?? '…');
  const n = Math.max(0, (state.players ?? 1) - 1);
  players.textContent = sd && state.alive != null ? `${state.alive} alive / ${n}` : `${n} players`;

  // The answer key, so the host can emcee without waiting for the reveal.
  // Only this page ever receives it — the relay strips it from everything
  // that isn't an authenticated host socket.
  const qz = state.quiz;
  alist.hidden = akey.hidden = true;
  if (qz && !inLobby && !over) {
    if (qz.kind === 'choice' && Array.isArray(qz.answers)) {
      alist.replaceChildren(...qz.answers.map((a, i) => {
        const li = document.createElement('li');
        li.textContent = a;
        const rights = Array.isArray(qz.correct) ? qz.correct : [qz.correct];
        if (rights.includes(i)) li.className = 'correct';
        return li;
      }));
      alist.hidden = false;
    } else if (qz.kind === 'range') {
      akey.textContent = `Answer: ${qz.lo}–${qz.hi}${qz.unit ? ' ' + qz.unit : ''}`;
      akey.hidden = false;
    } else if (qz.kind === 'tf') {
      akey.textContent = `Answer: ${qz.answer ? 'TRUE ✓' : 'FALSE ✕'}`;
      akey.hidden = false;
    } else if (qz.kind === 'control' && Array.isArray(qz.controls)) {
      alist.replaceChildren(...qz.controls.map((control) => {
        const li = document.createElement('li');
        const answer = typeof control.answer === 'boolean'
          ? control.answer ? 'YES' : 'NO'
          : `${control.answer}${control.unit ? ' ' + control.unit : ''}`;
        li.textContent = `${control.label}: ${answer}`;
        return li;
      }));
      alist.hidden = false;
    } else if (qz.kind === 'sort' && Array.isArray(qz.items)) {
      // The whole key at once, current item marked — the host reads ahead.
      alist.replaceChildren(...qz.items.map((it, i) => {
        const li = document.createElement('li');
        li.textContent = `${it.label} → ${qz.buckets?.[it.bucket] ?? it.bucket}`;
        if (i === qz.item) li.className = 'correct';
        return li;
      }));
      alist.hidden = false;
    }
  }

  nextBtn.textContent = sd
    ? 'Skip statement ▸'
    : inLobby ? 'Start game' : over ? 'Play again' : 'Skip to next question ▸';
  pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
  pauseBtn.disabled = (inLobby || over) && !sd;
  showdownBtn.hidden = !state.canShowdown;
  // The way out of a finished game: back to the lobby to change pack, answer
  // time or teams. Pointless in the lobby, so it hides there.
  menuBtn.hidden = inLobby;
  restartBtn.textContent = sd ? 'Abort showdown' : 'Restart from question 1';

  menuRow.hidden = !state.menu;
  if (state.menu) {
    packBtn.textContent = `Pack: ${state.menu.packs[state.menu.packIndex] ?? '?'} ▸`;
    timeBtn.textContent = `Time: ${Math.round(state.menu.answerMs / 1000)}s ▸`;
  }
}

nextBtn.addEventListener('click', () => cmd('next'));
menuBtn.addEventListener('click', () => cmd('menu'));

// ---------------------------------------------------------------- players
//
// Roster surgery from the back of the room: fold away the ghost of someone
// who went home, a duplicate join, or a test phone. DOM built with
// textContent throughout — names are player-typed input.
let rosterList = [];
const playersBtn = $('playersBtn'), plist = $('plist');

playersBtn.addEventListener('click', () => {
  plist.hidden = !plist.hidden;
  renderPlayers();
});

function renderPlayers() {
  playersBtn.textContent = `Manage players (${rosterList.length})`;
  if (plist.hidden) return;
  plist.replaceChildren();
  if (!rosterList.length) {
    const p = document.createElement('div');
    p.className = 'none';
    p.textContent = 'Nobody has joined yet.';
    plist.appendChild(p);
    return;
  }
  for (const pl of rosterList) {
    const row = document.createElement('div');
    row.className = pl.connected ? 'prow' : 'prow off';
    const dot = document.createElement('span');
    dot.className = 'swd';
    dot.style.background = pl.color || '#555';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = pl.name || `#${pl.id}`;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = (pl.cohortSet ? `PGY${(pl.cohortIndex ?? 0) + 1}` : 'no year')
      + (pl.connected ? '' : ' · offline');
    const kick = document.createElement('button');
    kick.textContent = 'Remove';
    kick.addEventListener('click', () => {
      if (!confirm(`Remove ${pl.name || 'player #' + pl.id}? They can rejoin, but start fresh.`)) return;
      sendJson({ type: 'KICK_PLAYER', playerId: pl.id });
      if (navigator.vibrate) navigator.vibrate(15);
    });
    row.append(dot, nm, meta, kick);
    plist.appendChild(row);
  }
}
pauseBtn.addEventListener('click', () => cmd(state?.paused ? 'resume' : 'pause'));
showdownBtn.addEventListener('click', () => cmd('showdown'));
packBtn.addEventListener('click', () => cmd('packnext'));
timeBtn.addEventListener('click', () => cmd('timenext'));

// Restart nukes the whole game, so it takes two taps: arm, then confirm.
let armTimer = 0;
restartBtn.addEventListener('click', () => {
  if (restartBtn.classList.contains('armed')) {
    restartBtn.classList.remove('armed');
    restartBtn.textContent = 'Restart from question 1';
    clearTimeout(armTimer);
    cmd('restart');
  } else {
    restartBtn.classList.add('armed');
    restartBtn.textContent = 'Tap again to confirm restart';
    armTimer = setTimeout(() => {
      restartBtn.classList.remove('armed');
      restartBtn.textContent = 'Restart from question 1';
    }, 3000);
  }
});

connect();
</script>
</body>
</html>
