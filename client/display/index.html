<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Platforms — display</title>
<style>
  /* Drop a woff2 at assets/fonts/display.woff2 and it takes over everywhere.
     Self-hosted on purpose: there is no internet at the venue, so a Google
     Fonts <link> would silently fall back on the night. font-display:block
     avoids a flash of the fallback face being measured into the label cache. */
  @font-face {
    font-family: 'PlatformsDisplay';
    src: url('/assets/fonts/display.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  html, body { margin:0; height:100%; background:#05070c; overflow:hidden; cursor:none; }
  canvas { display:block; width:100%; height:100%; object-fit:contain; image-rendering:auto; }
  #boot {
    position:fixed; inset:0; display:grid; place-items:center; color:#8b95a8;
    font:500 18px/1.5 ui-sans-serif, system-ui, sans-serif; text-align:center;
  }
  #boot.hidden { display:none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="boot">connecting to the relay…</div>
<script type="module" src="/client/display/main.js"></script>
</body>
</html>
