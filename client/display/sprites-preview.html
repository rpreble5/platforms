<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar preview</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f0f0f3; color: #26262e;
    font: 500 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 14px 20px; background: #f7f7f8; border-bottom: 1px solid #d8d8e0;
    display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 2;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .04em; color: #047857; }
  header p { margin: 0; color: #5c5c68; font-size: 13px; }
  kbd {
    background: #d8d8e0; border-radius: 4px; padding: 1px 6px;
    font: 600 12px ui-monospace, Menlo, monospace;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px; padding: 18px 20px;
  }
  .card { background: #e6e6ec; border: 1px solid #d8d8e0; border-radius: 12px; padding: 12px 14px; }
  .card.warn { border-color: #d97706; }
  .name { font-weight: 800; font-size: 15px; }
  .meta { color: #5c5c68; font-size: 12px; font-variant-numeric: tabular-nums; }
  .warnmsg { color: #b45309; font-size: 12px; margin-top: 4px; }
  .row { display: flex; align-items: flex-end; gap: 14px; margin-top: 10px; min-height: 92px; }
  .sizes { color: #8a8a96; font-size: 11px; margin-top: 2px; }
  section > h2 {
    margin: 22px 20px 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    color: #5c5c68; font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <h1>AVATAR PREVIEW</h1>
  <p>
    Every colour in both finishes on each year's body, at the three sizes the game actually draws. Edit <kbd>client/display/sprites.js</kbd> and refresh.
  </p>
</header>

<div id="out"></div>

<script type="module">
// Absolute paths: this page is served at /sprites, so anything relative would
// resolve against that rather than against the file's own directory.
import { getAvatar } from '/client/display/sprites.js';
import { ACCESSORIES, COHORTS, COLORS, FINISHES } from '/shared/palette.js';

const PLAYER_W = 40;
const PLAYER_H = 56;
// The scales in shared/tuning.js: a near-empty room, a middling one, a full one.
const SCALES = [
  { players: 8, s: 1 },
  { players: 16, s: 0.9 },
  { players: 30, s: 0.75 },
];

const out = document.getElementById('out');

// Accessory gallery first: every accessory on a pill at the three real
// sizes — the 30-player column is the one that decides if a silhouette
// earns its place.
{
  const section = document.createElement('section');
  const h2 = document.createElement('h2');
  h2.textContent = 'Accessories — every key on a jade pill';
  section.appendChild(h2);
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const acc of ACCESSORIES) {
    const card = document.createElement('div');
    card.className = 'card';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = acc.label;
    card.appendChild(name);
    const row = document.createElement('div');
    row.className = 'row';
    for (const { s } of SCALES) {
      const w = Math.round(PLAYER_W * s);
      const h = Math.round(PLAYER_H * s);
      const sprite = getAvatar('#059669', 'flat', w, h, 'pill', true, acc.key);
      const holder = document.createElement('div');
      const cv = document.createElement('canvas');
      cv.width = sprite.width;
      cv.height = sprite.height;
      cv.getContext('2d').drawImage(sprite, 0, 0);
      holder.appendChild(cv);
      const cap = document.createElement('div');
      cap.className = 'sizes';
      cap.textContent = `${w}×${h}`;
      holder.appendChild(cap);
      row.appendChild(holder);
    }
    card.appendChild(row);
    grid.appendChild(card);
  }
  section.appendChild(grid);
  out.appendChild(section);
}

COHORTS.forEach((cohort) => {
  const section = document.createElement('section');
  const h2 = document.createElement('h2');
  h2.textContent = `${cohort.label} — ${cohort.shape}, height ${cohort.height}`;
  section.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const fin of FINISHES) {
    for (const color of COLORS) {
      const card = document.createElement('div');
      card.className = 'card';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = `${color.name} · ${fin.label}`;
      card.appendChild(name);

      const row = document.createElement('div');
      row.className = 'row';
      for (const { s } of SCALES) {
        const w = Math.round(PLAYER_W * s);
        const h = Math.round(PLAYER_H * s * cohort.height);
        const sprite = getAvatar(color.hex, fin.key, w, h, cohort.shape);
        const holder = document.createElement('div');
        const cv = document.createElement('canvas');
        cv.width = sprite.width;
        cv.height = sprite.height;
        cv.getContext('2d').drawImage(sprite, 0, 0);
        holder.appendChild(cv);
        const cap = document.createElement('div');
        cap.className = 'sizes';
        cap.textContent = `${w}×${h}`;
        holder.appendChild(cap);
        row.appendChild(holder);
      }
      card.appendChild(row);
      grid.appendChild(card);
    }
  }

  section.appendChild(grid);
  out.appendChild(section);
});
</script>
</body>
</html>
