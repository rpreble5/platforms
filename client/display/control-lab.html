<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control floor lab</title>
<style>
  @font-face {
    font-family: 'PlatformsDisplay';
    src: url('/assets/fonts/display.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  html, body { margin:0; height:100%; overflow:hidden; background:#080b20; }
  canvas { display:block; width:100%; height:100%; object-fit:contain; }
  .tools {
    position:fixed; top:16px; right:18px; display:flex; gap:10px; align-items:center;
    padding:9px; border:1px solid rgba(255,255,255,.18); border-radius:14px;
    background:rgba(11,12,34,.72); backdrop-filter:blur(14px);
    font:700 14px/1 ui-sans-serif,system-ui,sans-serif; color:#fff;
  }
  select, button {
    color:#fff; background:#34305f; border:1px solid rgba(255,255,255,.2);
    border-radius:9px; padding:8px 11px; font:inherit; cursor:pointer;
  }
  button { background:#176c5c; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div class="tools">
  <select id="layout" aria-label="clinical scenario">
    <option value="neutropenia" selected>persistent neutropenic fever</option>
    <option value="hyponatremia">overcorrected hypoNa</option>
  </select>
  <select id="theme" aria-label="background">
    <option value="aurora" selected>aurora blend</option>
    <option value="berry">berry sunset</option>
    <option value="ocean">electric lagoon</option>
    <option value="glass">midnight violet</option>
  </select>
  <button id="reset">Reset controls</button>
</div>
<script type="module" src="/client/display/control-lab.js"></script>
</body>
</html>
