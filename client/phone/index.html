<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gamepad</title>
<style>
  /* The whole page is a control surface. Nothing here may scroll, zoom,
     select, long-press, or bounce — every one of those is a dropped input. */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; width:100%; overflow:hidden; position:fixed; inset:0;
    background:#0b0d12; color:#fff;
    font:600 16px/1.2 ui-sans-serif, -apple-system, system-ui, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; overscroll-behavior:none;
  }

  #bar {
    position:absolute; inset:0 0 auto 0; height:11vh; min-height:56px;
    display:flex; align-items:center; gap:10px; padding:0 14px;
    padding-top:env(safe-area-inset-top);
    background:#11141c; border-bottom:1px solid #1e2431; z-index:3;
  }
  /* The bar wears the player's colour at full strength. This is the identity
     anchor — "look at your phone, then find that on screen" — and a 34px chip
     was not enough to hold in your head while scanning thirty avatars. The
     control surface below stays dark, because contrast there is about hitting
     the right zone in a dim room. */
  #swatch {
    width:34px; height:34px; border-radius:9px; flex:none;
    display:grid; place-items:center; font-size:18px;
    background:rgba(11,13,18,.28); box-shadow:inset 0 0 0 2px rgba(11,13,18,.35);
  }
  #who { flex:1; min-width:0; }
  #name { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status { font-size:11px; color:#7d8798; font-weight:500; letter-spacing:.02em; }
  #rtt { font:700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color:#7d8798; text-align:right; }
  #rtt b { display:block; font-size:19px; color:#e8edf5; }
  #flagbtn { padding:8px 10px; margin:-8px -6px -8px 0; color:#3d4657; font-size:15px; }
  #flagbtn.on { color:#ffd93d; }

  /* Set once the look is known. Everything in the bar flips to dark ink; the
     whole palette is light enough to carry it. */
  #bar.lit { border-bottom-color:rgba(11,13,18,.4); }
  #bar.lit #name { color:#0b0d12; }
  #bar.lit #status { color:rgba(11,13,18,.62); }
  #bar.lit #rtt { color:rgba(11,13,18,.55); }
  #bar.lit #rtt b { color:#0b0d12; }
  #bar.lit #flagbtn { color:rgba(11,13,18,.35); }
  #bar.lit #flagbtn.on { color:#0b0d12; }

  #surface { position:absolute; inset:11vh 0 0 0; top:max(11vh,56px); display:flex; z-index:1; }
  .zone {
    flex:1; display:grid; place-items:center; position:relative;
    font-size:min(13vw,58px); color:#39425a;
    /* Not opaque: the body carries the player colour, and a little of it
       bleeding through ties the controls to the identity in the bar. */
    background:rgba(20,24,34,.88); border-left:1px solid #0b0d12;
    /* compositor-only press feedback: no layout, no paint, no rAF */
    transition:transform .04s linear, background-color .04s linear;
    will-change:transform;
  }
  .zone:first-child { border-left:0; }
  #jump { flex:2; background:rgba(26,32,48,.86); color:#4c5878; }
  .zone.down { transform:scale(.96); background:rgba(47,58,82,.92); }
  #jump.down { background:rgba(61,74,107,.92); }

  /* Full-screen white flash for the 240fps camera test. Painted on its own
     layer so it composites without a relayout. */
  #flash {
    position:absolute; inset:0; background:#fff; z-index:9;
    opacity:0; pointer-events:none; will-change:opacity;
  }
  #flash.on { opacity:1; }

  /* Feedback tint (correct / wrong / eliminated). */
  #tint { position:absolute; inset:0; z-index:8; opacity:0; pointer-events:none;
          transition:opacity .25s ease-out; will-change:opacity; }

  #overlay {
    position:absolute; inset:0; z-index:20; background:#0b0d12;
    display:grid; place-items:center; text-align:center; padding:28px;
    /* The one place on this page allowed to scroll: a short phone plus an open
       keyboard can leave the button below the fold. */
    overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:22px; margin-bottom:10px; }
  #overlay p { font-size:14px; font-weight:500; color:#9aa4b6; line-height:1.5; max-width:30ch; margin:0 auto; }
  #overlay .big { font-size:52px; margin-bottom:14px; }
  #nosleep { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  /* ---------------------------------------------------------------- setup */
  #setup { display:none; width:100%; max-width:380px; text-align:left; }
  #setup.on { display:block; }
  #setup h1 { text-align:center; }
  #setup .lbl {
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:#6c7789; margin:20px 0 8px;
  }
  /* 16px minimum, or iOS Safari zooms the whole page on focus and the layout
     never recovers. */
  #nameIn {
    width:100%; font:700 20px/1 inherit; color:#fff; background:#141822;
    border:2px solid #232a38; border-radius:12px; padding:14px 16px;
    -webkit-user-select:text; user-select:text; touch-action:auto;
  }
  #nameIn:focus { outline:none; border-color:#4aa8ff; }

  #years { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .yr {
    padding:16px 0; border-radius:12px; text-align:center;
    font:800 17px/1 inherit; color:#8792a6; background:#141822;
    border:3px solid transparent; touch-action:manipulation;
  }
  .yr.sel { color:#0b0d12; background:#e8edf5; border-color:#fff; }

  #swatches, #gear { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .gr {
    aspect-ratio:1; border-radius:14px; display:grid; place-items:center;
    font-size:26px; background:#141822; border:3px solid transparent;
    position:relative; touch-action:manipulation;
  }
  .gr.sel { border-color:#fff; background:#232a38; }
  .gr.out { opacity:.25; }

  /* Pattern buttons preview the real thing in the player's own colour, rather
     than using a glyph. It is the same information the display will show, and
     it costs four gradients. */
  #pats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .pt {
    aspect-ratio:1; border-radius:14px; border:3px solid transparent;
    touch-action:manipulation; overflow:hidden;
  }
  .pt.sel { border-color:#fff; }
  .sw {
    aspect-ratio:1; border-radius:14px; position:relative;
    border:3px solid transparent; display:grid; place-items:center;
    font-size:20px; transition:transform .06s linear;
  }
  .sw.sel { border-color:#fff; transform:scale(1.06); }
  /* Taken colours stay visible rather than vanishing — the grid holding still
     matters more than hiding four of twelve options. */
  .sw.out { opacity:.22; }
  .sw .g { color:rgba(0,0,0,.7); font-weight:900; }
  .sw .n { position:absolute; bottom:3px; right:6px; font:700 10px/1 ui-monospace,monospace; color:rgba(0,0,0,.6); }
  #go, .sw { touch-action:manipulation; }

  #go {
    width:100%; margin-top:22px; padding:18px; border-radius:14px; border:0;
    font:800 19px/1 inherit; color:#0b0d12; background:#3ddc9a;
  }
  #go[disabled] { background:#2b3446; color:#6c7789; }
  #setupNote { text-align:center; margin-top:14px; font-size:12px; color:#6c7789; }
</style>
</head>
<body>

<div id="bar">
  <div id="swatch">?</div>
  <div id="who"><div id="name">connecting…</div><div id="status">joining the game</div></div>
  <div id="rtt"><b>—</b>ms rtt</div>
  <div id="flagbtn">⚑</div>
</div>

<div id="surface">
  <div class="zone" id="left" data-btn="left">◀</div>
  <div class="zone" id="right" data-btn="right">▶</div>
  <div class="zone" id="jump" data-btn="jump">JUMP</div>
</div>

<div id="tint"></div>
<div id="flash"></div>
<video id="nosleep" muted playsinline loop preload="auto"></video>

<div id="overlay">
  <div id="msg">
    <div class="big">🎮</div>
    <h1 id="ovh">Joining…</h1>
    <p id="ovp">Connecting to the game.</p>
  </div>

  <div id="setup">
    <h1>Who are you?</h1>
    <div class="lbl">Your name</div>
    <input id="nameIn" maxlength="12" autocomplete="off" autocorrect="off"
           autocapitalize="words" spellcheck="false" enterkeyhint="done">
    <div class="lbl">Your year</div>
    <div id="years"></div>
    <div class="lbl">Your colour</div>
    <div id="swatches"></div>
    <div class="lbl" id="gearLbl">Your accessory</div>
    <div id="gear"></div>
    <div class="lbl">Your pattern</div>
    <div id="pats"></div>
    <button id="go" disabled>Connecting…</button>
    <p id="setupNote">Set Auto-Lock to <b>Never</b> so your screen stays awake.</p>
  </div>
</div>

<script>
/*__PROTOCOL__*/
/*__TUNING__*/
/*__PALETTE__*/

(function () {
  'use strict';

  // ------------------------------------------------------------------ elements
  var $ = function (id) { return document.getElementById(id); };
  var elSurface = $('surface'), elFlash = $('flash'), elTint = $('tint');
  var elName = $('name'), elStatus = $('status'), elRtt = $('rtt').firstElementChild;
  var elSwatch = $('swatch'), elOverlay = $('overlay'), elOvh = $('ovh'), elOvp = $('ovp');
  var elFlag = $('flagbtn'), elMsg = $('msg');
  var elSetup = $('setup'), elNameIn = $('nameIn'), elSwatches = $('swatches'), elGo = $('go');
  var elYears = $('years'), elGear = $('gear'), elPats = $('pats');
  var zones = { left: $('left'), right: $('right'), jump: $('jump') };

  // ------------------------------------------------------------------ identity
  //
  // The token is namespaced by an optional ?seat= parameter. Without it, every
  // tab on one machine shares localStorage, sends the same token, and the
  // server's takeover logic makes them kick each other in a loop — which makes
  // it impossible to test multiplayer from a single laptop. ?seat=3 gives that
  // tab its own identity. Real players never pass it. See /testpad.
  var seat = new URLSearchParams(location.search).get('seat') || '';
  var TOKEN_KEY = 'platforms.token' + (seat ? '.' + seat : '');
  var NAME_KEY = 'platforms.name' + (seat ? '.' + seat : '');

  var token = null, savedName = '';
  try {
    token = localStorage.getItem(TOKEN_KEY);
    savedName = localStorage.getItem(NAME_KEY) || '';
  } catch (e) { /* private mode */ }
  var clientSalt = hash32(token || String(Math.random()));
  /** Stagger periodic sends, or 30 phones sync on second boundaries and
   *  manufacture their own airtime contention. */
  var phase = clientSalt % HEARTBEAT_MS;

  var playerId = 0;

  // Setup state. `joined` is the latch that stops a mid-game reconnect from
  // throwing the picker back over the controls: HELLO_ACK arrives again on
  // every reconnect, and only the first one is a join.
  var joined = false;
  var pickedColor = -1;
  var pickedGear = -1;      // global accessory index; its range implies the year
  var pickedPattern = 0;
  var pickedYear = -1;      // deliberately unset: nobody should land in a year by accident
  var freeByColor = null;   // number[12] from the server, or null before first ack

  // ------------------------------------------------------------------ input state
  var held = 0;          // authoritative mask, recomputed from live pointers
  var seq = 0;
  var lastSentMask = 0;
  var lastSendAt = 0;
  var lastEchoReqAt = 0;
  var pointers = new Map();   // pointerId -> zone name
  var bothSinceAt = 0;        // for the LEFT+RIGHT find-me gesture
  var findMeLatched = false;
  var flashMode = false;

  // ------------------------------------------------------------------ rtt stats
  var samples = [];
  var echoAsked = 0, echoGot = 0;
  var lastStatsAt = 0;

  // ------------------------------------------------------------------ socket
  var ws = null, connected = false, backoff = 250, reconnectTimer = 0;

  function wsUrl() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return proto + '//' + location.host + '/ws';
  }

  function connect() {
    clearTimeout(reconnectTimer);
    try { ws = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
    ws.binaryType = 'arraybuffer';

    ws.onopen = function () {
      connected = true;
      backoff = 250;
      setStatus('connected');
      sendJson({ type: 'HELLO', token: token || undefined, name: savedName || undefined });
      // Re-assert the current mask right away: the server may have watchdogged
      // us to zero while we were away.
      lastSentMask = -1;
      pushInput(false);
    };

    ws.onmessage = function (ev) {
      var bytes = new Uint8Array(ev.data);
      if (!bytes.length) return;
      var type = bytes[0];

      if (type === T_ECHO) {
        var v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        var e = decodeEcho(v);
        var rtt = since16(e.stamp16, t16(performance.now()));
        if (rtt >= 0 && rtt < 5000) {
          echoGot++;
          samples.push(rtt);
          if (samples.length > 120) samples.shift();
          elRtt.textContent = String(rtt);
        }
        return;
      }

      if (type === T_FEEDBACK) { feedback(bytes[1]); return; }

      if (type === T_JSON) {
        var msg;
        try { msg = decodeJson(bytes); } catch (err) { return; }
        onJson(msg);
      }
    };

    ws.onclose = function () {
      connected = false;
      setStatus('reconnecting…');
      // Before the first join there are no controls behind the overlay, so say
      // what is wrong instead of leaving a dead "tap to join" on screen.
      if (!joined) showMessage('📡', 'Can’t reach the game', 'Check you are on the same WiFi as the host, then wait a moment.');
      scheduleReconnect();
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 4000);
  }

  function onJson(msg) {
    if (msg.type === 'HELLO_ACK' || msg.type === 'LOOK') {
      playerId = msg.playerId;
      token = msg.token;
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      phase = hash32(token) % HEARTBEAT_MS;
      applyLook(msg);

      if (msg.type === 'HELLO_ACK' && !joined) {
        // Prefill from what the server settled on, so the fields always show a
        // real identity rather than a guess that might not survive the round
        // trip.
        if (pickedColor < 0) pickedColor = msg.colorIndex;
        if (!elNameIn.value) elNameIn.value = msg.named ? msg.name : '';
        elNameIn.placeholder = msg.name;
        openSetup();
      }
    } else if (msg.type === 'LOOKS') {
      freeByColor = msg.free;
      paintSwatches();
    } else if (msg.type === 'KICK') {
      showMessage('👋', 'Disconnected', msg.reason || '');
      try { ws.close(); } catch (e) {}
    } else if (msg.type === 'STATE' && msg.msg) {
      setStatus(msg.msg);
    }
  }

  // The phone IS the identity anchor: whole-screen colour plus hat glyph.
  // "Look at your phone, then find that on screen" is the whole mechanism for
  // picking yourself out of 30 avatars, so this runs on every identity change.
  function applyLook(msg) {
    elName.textContent = msg.name;
    document.body.style.background = msg.color;
    $('bar').style.background = msg.color;
    $('bar').classList.add('lit');
    elSwatch.textContent = (ACCESSORIES[msg.hatIndex] || {}).glyph || '●';
    setStatus('you are ' + msg.name + ' · ' + (COHORTS[msg.cohortIndex] || {}).label);
    if (typeof msg.colorIndex === 'number') pickedColor = msg.colorIndex;
    // Only adopt the server's year and accessory once the player has actually
    // committed to one. Before that the record holds a placeholder, and echoing
    // it into the picker would silently answer the one question the card exists
    // to ask. After a reload mid-party the flag comes back true with the token,
    // so a returning player is not made to pick again.
    if (msg.cohortSet) {
      if (typeof msg.cohortIndex === 'number') pickedYear = msg.cohortIndex;
      if (typeof msg.hatIndex === 'number') pickedGear = msg.hatIndex;
      if (typeof msg.patternIndex === 'number') pickedPattern = msg.patternIndex;
      buildGear();
    }
    if (msg.free) freeByColor = msg.free;
    paintSwatches();
  }

  function sendJson(obj) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(encodeJson(obj));
  }

  // ------------------------------------------------------------------ the hot path
  //
  // Sent synchronously inside the pointer handler. There is deliberately no
  // requestAnimationFrame loop anywhere on this page — batching input to a
  // frame would add up to 16ms for no benefit whatsoever.
  function pushInput(isHeartbeat) {
    if (!ws || ws.readyState !== 1) return;
    var now = performance.now();
    var flags = 0;
    if (isHeartbeat) flags |= F_HEARTBEAT;
    if (document.hidden) flags |= F_PAGE_HIDDEN;
    if (now - lastEchoReqAt >= ECHO_EVERY_MS) {
      flags |= F_REQ_ECHO;
      lastEchoReqAt = now;
      echoAsked++;
    }
    seq = (seq + 1) & 0xffff;
    // Full mask every time — a lost or reordered packet self-heals on the next
    // one, and there is no press/release pairing to fall out of sync.
    ws.send(encodeInput(T_INPUT, held, flags, seq, t16(now)));
    lastSentMask = held;
    lastSendAt = now;
  }

  function recomputeMask() {
    var m = 0;
    pointers.forEach(function (zone) {
      if (zone === 'left') m |= BTN_LEFT;
      else if (zone === 'right') m |= BTN_RIGHT;
      else if (zone === 'jump') m |= BTN_JUMP;
    });

    // Find-me: hold LEFT+RIGHT together. Highest-value feature for 30 players.
    var both = (m & BTN_LEFT) && (m & BTN_RIGHT);
    if (both) {
      if (!bothSinceAt) bothSinceAt = performance.now();
      else if (!findMeLatched && performance.now() - bothSinceAt >= FINDME_HOLD_MS) {
        findMeLatched = true;
        m |= BTN_FINDME;
        vibrate(20);
      }
    } else {
      bothSinceAt = 0;
      findMeLatched = false;
    }
    if (findMeLatched) m |= BTN_FINDME;

    if (m !== held) {
      var pressed = m & ~held;
      held = m;
      paintZones();
      pushInput(false);
      if (pressed & BTN_JUMP) {
        vibrate(12);
        if (flashMode) doFlash();
      }
    }
  }

  function zoneAt(clientX, clientY) {
    var r = elSurface.getBoundingClientRect();
    if (clientY < r.top) return null;
    var x = clientX - r.left;
    if (x < r.width * 0.25) return 'left';
    if (x < r.width * 0.5) return 'right';
    return 'jump';
  }

  function paintZones() {
    zones.left.classList.toggle('down', !!(held & BTN_LEFT));
    zones.right.classList.toggle('down', !!(held & BTN_RIGHT));
    zones.jump.classList.toggle('down', !!(held & BTN_JUMP));
  }

  // One surface, not three buttons. A Map of live pointers gives multitouch
  // (left + jump at once), sliding between zones, and correct release when a
  // finger drifts off — all fiddly with per-button listeners.
  function onDown(e) {
    e.preventDefault();
    var z = zoneAt(e.clientX, e.clientY);
    if (!z) return;
    pointers.set(e.pointerId, z);
    recomputeMask();
  }
  function onMove(e) {
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();
    var z = zoneAt(e.clientX, e.clientY);
    if (z !== pointers.get(e.pointerId)) {
      if (z) pointers.set(e.pointerId, z); else pointers.delete(e.pointerId);
      recomputeMask();
    }
  }
  function onUp(e) {
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.delete(e.pointerId);
    recomputeMask();
  }

  var opts = { passive: false };
  elSurface.addEventListener('pointerdown', onDown, opts);
  elSurface.addEventListener('pointermove', onMove, opts);
  elSurface.addEventListener('pointerup', onUp, opts);
  // pointercancel fires on iOS system gestures. Miss it and the avatar runs
  // off the level forever — the single most visible bug in the game.
  elSurface.addEventListener('pointercancel', onUp, opts);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, opts);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, opts);
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, opts);

  // ------------------------------------------------------------------ release on background
  function releaseAll(reason) {
    pointers.clear();
    if (held !== 0) { held = 0; paintZones(); }
    // Send it even if the mask was already 0 — cheap, and it beats the watchdog.
    pushInput(false);
    setStatus(reason);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      releaseAll('paused (screen off)');
    } else {
      setStatus(connected ? 'connected' : 'reconnecting…');
      // Bypass backoff — the socket is usually already dead by now on iOS.
      if (!ws || ws.readyState > 1) { backoff = 250; connect(); }
    }
  });
  window.addEventListener('pagehide', function () { releaseAll('paused'); });
  window.addEventListener('blur', function () { releaseAll('paused'); });

  // ------------------------------------------------------------------ periodic
  setInterval(function () {
    var now = performance.now();
    if (!ws || ws.readyState !== 1) return;

    // Heartbeat: resend an unchanged mask. Layer two of three against the
    // dropped-release bug (full mask, this, and the server-side watchdog).
    if (now - lastSendAt >= HEARTBEAT_MS + (phase % 60)) {
      if (held !== 0 || lastSentMask !== 0) pushInput(true);
      else if (now - lastSendAt >= IDLE_PING_MS) {
        // Idle ping keeps the 802.11 association warm and the HUD alive.
        seq = (seq + 1) & 0xffff;
        echoAsked++;
        lastEchoReqAt = now;
        ws.send(encodeInput(T_PING, 0, F_REQ_ECHO, seq, t16(now)));
        lastSendAt = now;
      }
    }

    if (now - lastStatsAt >= STATS_EVERY_MS + phase) {
      lastStatsAt = now;
      if (samples.length >= 3) {
        var s = samples.slice().sort(function (a, b) { return a - b; });
        sendJson({
          type: 'STATS',
          rttP50: s[Math.floor(s.length * 0.5)],
          rttP95: s[Math.min(s.length - 1, Math.floor(s.length * 0.95))],
          loss: echoAsked ? Math.max(0, 1 - echoGot / echoAsked) : 0,
        });
      }
    }
  }, 100);

  // ------------------------------------------------------------------ feedback
  function feedback(code) {
    var color = code === FB_LANDED_CORRECT ? '#2fc98d'
      : code === FB_LANDED_WRONG ? '#ff5a3c'
      : code === FB_ELIMINATED ? '#000'
      : code === FB_SCORED ? '#ffd93d' : '#4aa8ff';
    elTint.style.background = color;
    elTint.style.transition = 'none';
    elTint.style.opacity = '0.85';
    requestAnimationFrame(function () {
      elTint.style.transition = 'opacity .4s ease-out';
      elTint.style.opacity = '0';
    });
    vibrate(code === FB_LANDED_WRONG || code === FB_ELIMINATED ? [30, 40, 30] : 25);
  }

  // Android only. iOS Safari has no navigator.vibrate at all, so the visual
  // press feedback has to carry the whole job there.
  function vibrate(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  // ------------------------------------------------------------------ flash test
  //
  // Marks the moment of a JUMP press with a full-screen white frame so a 240fps
  // camera can catch the phone and the TV in one shot. Note the phone's own
  // display pipeline delays this flash by ~20-40ms, so THUMB -> TV is the true
  // number and FLASH -> TV is a lower bound. See docs/venue-check.md.
  function doFlash() {
    elFlash.classList.add('on');
    setTimeout(function () { elFlash.classList.remove('on'); }, 100);
  }
  function setFlashMode(on) {
    flashMode = on;
    elFlag.classList.toggle('on', on);
    setStatus(on ? 'flash test ON — film thumb + TV at 240fps' : 'flash test off');
  }
  elFlag.addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation();
    setFlashMode(!flashMode);
  }, opts);
  if (location.hash.indexOf('flash') >= 0) setFlashMode(true);

  // ------------------------------------------------------------------ keep awake
  //
  // The phone page is plain HTTP so it is NOT a secure context and wakeLock is
  // unavailable. We try it anyway (it works from localhost, and if this is ever
  // served over HTTPS), then fall back to the silent-looping-video hack if the
  // asset has been generated. Neither is guaranteed, hence the instruction.
  var wakeLock = null;
  function keepAwake() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { videoFallback(); });
    } else {
      videoFallback();
    }
  }
  // iOS Safari needs the mp4 (it will not play VP8); Android Chrome takes
  // either. The mp4 is not committed because it needs a real ffmpeg to build —
  // run tools/make-nosleep.sh. Without it, iPhones fall back to the printed
  // "Auto-Lock: Never" instruction, which is why that instruction is on the
  // join overlay rather than buried in a README.
  function videoFallback() {
    var v = $('nosleep');
    if (v.dataset.tried) return;
    v.dataset.tried = '1';
    var sources = ['/nosleep.mp4', '/nosleep.webm'];
    (function next(i) {
      if (i >= sources.length) return;
      fetch(sources[i], { method: 'HEAD' }).then(function (r) {
        if (!r.ok) return next(i + 1);
        v.src = sources[i];
        v.play().catch(function () { next(i + 1); });
      }).catch(function () { next(i + 1); });
    })(0);
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !wakeLock) keepAwake();
  });

  // ------------------------------------------------------------------ overlay
  function showMessage(icon, head, body) {
    elSetup.classList.remove('on');
    elMsg.style.display = '';
    elMsg.querySelector('.big').textContent = icon;
    elOvh.textContent = head;
    elOvp.textContent = body;
    elOverlay.classList.remove('hidden');
  }
  function hideOverlay() { elOverlay.classList.add('hidden'); }
  function setStatus(s) { elStatus.textContent = s; }

  // ------------------------------------------------------------------ setup
  //
  // Shown before the controls, and reachable again from the swatch in the top
  // bar. Picking a colour is also the gesture that unlocks fullscreen, wake lock
  // and vibration — all three need a real user interaction, and hanging them off
  // a tap the player was going to make anyway beats asking for one.
  //
  // Colour is a request. The server owns the answer, because 12 colours cannot
  // cover 30 players: it pairs your colour with a free hat, and moves you to a
  // neighbouring colour if all four of yours are gone. Whatever comes back is
  // what the picker then shows.

  function buildPickers() {
    for (var y = 0; y < COHORTS.length; y++) {
      var b = document.createElement('div');
      b.className = 'yr';
      b.dataset.i = String(y);
      b.textContent = COHORTS[y].label;
      elYears.appendChild(b);
    }
    for (var i = 0; i < COLORS.length; i++) {
      var s = document.createElement('div');
      s.className = 'sw';
      s.style.background = COLORS[i].hex;
      s.dataset.i = String(i);
      s.innerHTML = '<span class="g"></span><span class="n"></span>';
      elSwatches.appendChild(s);
    }
    // The accessory row is rebuilt whenever the year changes, so it starts empty.

    tapper(elYears, '.yr', function (i) {
      if (i === pickedYear) return;
      pickedYear = i;
      // The accessory they were wearing does not exist in the new year's pool.
      pickedGear = poolFor(i)[0];
      buildGear();
      paintSwatches();
    });
    for (var q = 0; q < PATTERNS.length; q++) {
      var t = document.createElement('div');
      t.className = 'pt';
      t.dataset.i = String(q);
      elPats.appendChild(t);
    }

    tapper(elSwatches, '.sw', function (i) { pickedColor = i; paintSwatches(); });
    tapper(elGear, '.gr', function (i) { pickedGear = i; paintSwatches(); });
    tapper(elPats, '.pt', function (i) { pickedPattern = i; paintSwatches(); });
  }

  /**
   * The pattern previews, tinted to whatever colour is currently selected. Uses
   * CSS gradients rather than the canvas shapes the display draws — close
   * enough to choose from, and it keeps the phone free of drawing code.
   */
  function paintPatterns(hex) {
    var mark = 'rgba(0,0,0,.42)';
    var css = {
      solid: hex,
      dots: 'radial-gradient(circle at 30% 62%, ' + mark + ' 15%, transparent 16%),' +
            'radial-gradient(circle at 72% 62%, ' + mark + ' 15%, transparent 16%),' +
            'radial-gradient(circle at 50% 86%, ' + mark + ' 15%, transparent 16%),' + hex,
      band: 'linear-gradient(' + hex + ' 54%, ' + mark + ' 54%, ' + mark + ' 74%, ' + hex + ' 74%)',
      sash: 'linear-gradient(48deg, ' + hex + ' 34%, ' + mark + ' 34%, ' + mark + ' 60%, ' + hex + ' 60%)',
    };
    for (var i = 0; i < elPats.children.length; i++) {
      var el = elPats.children[i];
      el.style.background = css[PATTERNS[i].key] || hex;
      el.classList.toggle('sel', i === pickedPattern);
    }
  }

  /** One delegated pointerdown per row, skipping anything greyed out. */
  function tapper(root, sel, fn) {
    root.addEventListener('pointerdown', function (e) {
      var el = e.target.closest ? e.target.closest(sel) : null;
      if (!el || el.classList.contains('out')) return;
      e.preventDefault();
      fn(Number(el.dataset.i));
      vibrate(8);
    }, opts);
  }

  function buildGear() {
    elGear.innerHTML = '';
    if (pickedYear < 0) return;
    var pool = poolFor(pickedYear);
    for (var k = 0; k < pool.length; k++) {
      var g = document.createElement('div');
      g.className = 'gr';
      g.dataset.i = String(pool[k]);
      g.textContent = ACCESSORIES[pool[k]].glyph;
      elGear.appendChild(g);
    }
  }

  function paintSwatches() {
    var chosen = pickedYear >= 0;
    $('gearLbl').style.opacity = chosen ? '1' : '.3';

    for (var y = 0; y < elYears.children.length; y++) {
      elYears.children[y].classList.toggle('sel', y === pickedYear);
    }
    for (var i = 0; i < elSwatches.children.length; i++) {
      var el = elSwatches.children[i];
      var free = freeByColor ? freeByColor[i] : SLOTS_PER_COLOR;
      // Your own slot is already spent from the server's point of view, so
      // don't grey out the colour you're standing in.
      var out = free <= 0 && i !== pickedColor;
      el.classList.toggle('out', out);
      el.classList.toggle('sel', i === pickedColor);
      // Only worth showing when it is actually running out. With sixteen looks
      // per colour per year, a running count is noise for the whole evening.
      el.querySelector('.n').textContent = free > 0 && free <= 3 ? String(free) : '';
      el.querySelector('.g').textContent = i === pickedColor ? '✓' : '';
    }
    for (var k = 0; k < elGear.children.length; k++) {
      var gEl = elGear.children[k];
      gEl.classList.toggle('sel', Number(gEl.dataset.i) === pickedGear);
    }
    paintPatterns(COLORS[pickedColor >= 0 ? pickedColor : 0].hex);

    // A year is the one thing with no sensible default, so it gates the button.
    elGo.disabled = !connected || !chosen;
    elGo.textContent = !connected ? 'Connecting…'
      : !chosen ? 'Pick your year'
      : joined ? 'Save' : "I'm ready";
  }

  function openSetup() {
    elMsg.style.display = 'none';
    elSetup.classList.add('on');
    elOverlay.classList.remove('hidden');
    buildGear();
    paintSwatches();
  }

  function submitSetup() {
    if (!connected || pickedYear < 0) return;
    sendJson({
      type: 'SET_LOOK',
      name: elNameIn.value,
      colorIndex: pickedColor,
      hatIndex: pickedGear,
      patternIndex: pickedPattern,
      cohortIndex: pickedYear,
    });
    try { localStorage.setItem(NAME_KEY, elNameIn.value); } catch (e) {}
    savedName = elNameIn.value;
    elNameIn.blur();
    hideOverlay();
    if (!joined) {
      joined = true;
      // First tap only: these all require a user gesture, and re-requesting
      // fullscreen on a later save would be obnoxious.
      keepAwake();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    }
    vibrate(15);
  }

  buildPickers();
  elGo.addEventListener('click', function (e) { e.preventDefault(); submitSetup(); });
  elNameIn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitSetup(); }
  });
  // Reopening from the top bar. Not a control-surface tap, so it must not fall
  // through to the movement zones.
  elSwatch.addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation();
    if (joined) openSetup();
  }, opts);

  function hash32(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0);
  }

  connect();
})();
</script>
</body>
</html>
