# Render Blueprint: the FACULTY TEST INSTANCE — not game night.
#
# One-time setup: render.com -> sign in with GitHub -> New -> Blueprint ->
# pick this repository. Render reads this file, builds the free web
# service, and redeploys it automatically on every push to the branch
# below. Share https://<name>.onrender.com/display/ with faculty; the QR
# on that page points phones at the same public URL automatically
# (server/index.js prefers RENDER_EXTERNAL_URL over the LAN address).
#
# The cloud hop adds ~60-150 ms to every button press — fine for one
# person evaluating content, disqualifying for a 30-player race. Game
# night runs on the host laptop over LAN, exactly as before.
# NOTE: this name is a REQUEST for the <name>.onrender.com subdomain —
# onrender.com names are global across all Render users, and a taken name
# gets a random suffix. Whatever happens, copy the real URL from the top
# of the service page in the Render dashboard; never assemble it by hand.
services:
  - type: web
    name: platforms-quiz-night
    runtime: node
    plan: free
    branch: claude/multiplayer-platformer-quiz-xnvuc2
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The /host page key. Render generates a stable random value; read
      # it in the dashboard (Environment tab) when you want host controls
      # on the test instance.
      - key: HOST_KEY
        generateValue: true
      # AI drafting in the Pack Studio (optional). Set both in the
      # dashboard: the Anthropic API key that pays for drafts, and the
      # passcode you give faculty so strangers can't spend your credits.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PASSCODE
        sync: false
